<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotina de Trabalho - Chronos 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="space-container">
        <div class="stars stars-back"></div>
        <div class="stars stars-mid"></div>
        <div class="stars stars-front"></div>
    </div>

    <div class="page-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar ao Painel</a>
        <div class="modal-header">
            <i class="fa-solid fa-briefcase modal-icon"></i>
            <h2>Gestão de Trabalho</h2>
        </div>
        <div class="modal-body" style="margin-top: 20px;">
            <h3>Fluxo de Trabalho</h3>
            <ul>
                <li><i class="fa-solid fa-envelope"></i> <strong>09:00:</strong> Triagem de Mensagens e E-mails</li>
                <li><i class="fa-solid fa-users"></i> <strong>09:30:</strong> Reunião de Alinhamento</li>
                <li><i class="fa-solid fa-code"></i> <strong>10:00 - 18:00:</strong> Blocos de Foco Total (Método Pomodoro)</li>
            </ul>
        </div>
    </div>
</body>
</html>
